  // ── Lesson 35: The Data Tier — Amazon RDS ──
  { lesson: "Lesson 35", q: "A database needs five jobs done: install/patch the engine, back up and prove the restore, keep serving when the machine dies, hold the password out of the code, and report health. Moving Postgres from the app server onto its own separate EC2 server solves which of these?", answers: ["Only \"keep serving when the machine dies\" for the app server — the other four still have to be done by hand, now on two machines instead of one", "All five, since the database is no longer competing with the app for resources", "Only \"install and patch the engine\", since a dedicated server can be sized for Postgres alone", "None of them — the jobs only get handed off once RDS specifically is used, not just a second server"], correct: 0, explain: "Slide 8: separating Postgres onto its own server means the app surviving a database-server crash (and vice versa), but you still install it, patch it, back it up, and watch it yourself — just twice over. That's why the deck moves straight to a managed service instead." },
  { lesson: "Lesson 35", q: "An RDS instance has no SSH access, no shell, and nothing in your AWS account to log into — yet it still has a hostname, port, user, and password. What does this tell you about what \"managed\" means?", answers: ["Another company (AWS) does the operational jobs and you lose OS-level access in exchange — it is not a quality tier or an easier version of the same machine, it's a different arrangement of who does the work", "RDS instances aren't real servers at all, just a SQL API endpoint with no underlying machine", "\"Managed\" only affects billing, not access — an EC2 instance with Postgres installed would behave identically", "The lack of SSH is a temporary limitation that gets enabled once the instance leaves creation state"], correct: 0, explain: "Slides 6 and 12: RDS is a real instance running Postgres somewhere AWS controls — you still connect with host/port/user/password exactly as before, but you talk to it only in SQL, never as a machine you can log into." },
  { lesson: "Lesson 35", q: "After restoring an RDS database from a snapshot, automated backup, or point-in-time recovery, what do you actually get?", answers: ["A brand-new database with a new hostname, running alongside the original — nothing is put back in place, so the app has to be pointed at the new hostname afterward", "The exact same database, back online at its original hostname, with no further action needed", "A read replica of the original database that lags behind by a few seconds", "The original machine's standby, promoted automatically to take over the same hostname"], correct: 0, explain: "Slide 31: every restore path produces a second, separate database with its own hostname. That's exactly why the hostname lives in the app's secret rather than being hardcoded — recovery means restore, verify, then repoint the app." },

  // ── Lesson 36: The Data Tier — Networking, Cutover, and the Move ──
  { lesson: "Lesson 36", q: "A subnet is named \"public-a\" and its address range sits inside the VPC's CIDR block like every other subnet. Neither fact tells you whether it's actually reachable from the internet. What does?", answers: ["The subnet's route table — a line for 0.0.0.0/0 pointing at an internet gateway makes it public; pointing at a NAT gateway, or no such line at all, makes it private", "The subnet's name, since AWS enforces that \"public\" and \"private\" subnets are named accordingly", "The size of the subnet's CIDR range relative to the VPC's", "Which Availability Zone the subnet happens to be placed in"], correct: 0, explain: "Slide 16: the name proves nothing and the address range proves nothing — every subnet sits inside the VPC's range. Only the 0.0.0.0/0 route decides: internet gateway is public, NAT gateway is still private (can reach out, can't be reached), no such line is private with no route out at all. The local line AWS always adds is not a route to the internet either." },
  { lesson: "Lesson 36", q: "Before moving any data onto the new RDS database, the deck runs `nc -vz <endpoint> 5432` and only then `psql` against that same endpoint. Why that order?", answers: ["It isolates the problem — if nc fails, the network path itself is closed (security group or subnets), and there's no point blaming the user, password, or database name yet, which is all psql could tell you next", "nc opens the TLS connection that psql then reuses, so psql has nothing to negotiate on its own", "nc creates the investment_app database and role that psql's connection string depends on", "psql cannot resolve the endpoint's hostname until nc has run once to warm the DNS cache"], correct: 0, explain: "Slide 20: nc failing means nothing is listening — a security group rule or a network mismatch, not a credentials problem. nc working but psql failing narrows it straight to the user, password, or database name. Run both from the app server, since that's the machine that actually has to reach it." },
  { lesson: "Lesson 36", q: "Once database.tf lands in the same Terraform folder as the app server, why does \"terraform destroy then terraform apply\" become the wrong way to replace the server?", answers: ["destroy would delete the database along with the server, and skip_final_snapshot = true means nothing is kept — apply alone is enough, since user_data_replace_on_change = true already forces the server to be rebuilt", "destroy simply takes longer to run than apply, so skipping it is only a speed optimization", "apply alone is incapable of rebuilding a running server without a prior destroy step", "database.tf places a lock on the state file that only a destroy can release before any apply will run"], correct: 0, explain: "Slide 27: the rows just migrated by hand would be gone, because destroy in that folder now takes the database with it and the final-snapshot safety net is off. Terraform apply alone already rebuilds the server — the repository sets user_data_replace_on_change = true — so destroy was never needed for that part anyway." },

  // ── Lesson 37: The Data Tier, Done — and More Than One App Server ──
  { lesson: "Lesson 37", q: "A teammate proposes making the health endpoint query the database, so a struggling database also takes every app server off the load balancer's list. Why is this the wrong design?", answers: ["A health check should only test what this one machine is responsible for — checking a shared dependency means a single slow database makes every server report itself as dead at the same moment, turning one problem into a total outage", "The database has no way to respond to an HTTP request, so the endpoint would always time out regardless of database health", "Health endpoints can only run on port 80, and the database connection uses a different port", "The load balancer already checks the database directly, so having each app server check it too would just double the load"], correct: 0, explain: "Slide 2: querying the database from the health check makes every server report itself as dead at the same moment on a database wobble — check what this machine is responsible for, and nothing farther away." },
  { lesson: "Lesson 37", q: "A database with `multi_az = true` fails over to its standby after the primary machine dies. What actually happens?", answers: ["The hostname stays the same, so nothing needs to be redeployed — but every open connection drops and has to be re-established, and the failover itself takes 60 to 120 seconds", "The application must be redeployed pointed at a new hostname, but existing connections stay open the whole time", "Failover is instantaneous with no dropped connections, since the standby was already fully synced", "Once the failed machine comes back, it resumes as the database and the promoted standby reverts to being the standby"], correct: 0, explain: "Slide 7: the hostname doesn't change, so there's nothing to edit — but open connections break and have to reconnect, the switch takes 60–120 seconds, and nothing moves back afterward: the promoted standby stays the database, and the machine that failed returns as the new standby." },
  { lesson: "Lesson 37", q: "Why can't a `multi_az = true` standby be used to offload read traffic from the primary database?", answers: ["The standby has no address you can connect to — reading from a copy is what a read replica is for, which has its own hostname but lags behind the primary", "The standby only stores schema information, not the actual row data, so any query against it returns nothing", "Reading from the standby is possible but only after Multi-AZ is disabled, which removes the failover protection", "The standby only refreshes once every 24 hours, so a read from it is stale by definition"], correct: 0, explain: "Slide 8: the standby has no address you can connect to. A read replica is a different thing — a copy with its own hostname that you can read from, and it lags, so a value you just wrote may still show the old one there." },

  // ── Lesson 38: More Than One App Server ──
  { lesson: "Lesson 38", q: "A Terraform `for_each` block builds app servers from a map with two entries, `frontend` and `backend`. What actually determines how many machines get created and what identifies each one?", answers: ["Terraform runs the resource block once per entry in the set; each entry's key (`each.key`) names that instance, not a counted index", "The `count` argument set on the same resource, which `for_each` silently wraps", "The number of availability zones in the VPC, regardless of how many map entries exist", "The order the entries are listed in, since `for_each` processes them as a numbered sequence"], correct: 0, explain: "Slide 2: one resource block, repeated over a set of named entries — add a line, get a machine; delete a line, Terraform destroys that one and leaves the others alone. There's no counter and no first-or-second, only names." },
  { lesson: "Lesson 38", q: "A request arrives at an Application Load Balancer, which consults a listener and a rule, reads a target group's list, and sends the request to one machine. What is actually true about those three parts?", answers: ["The listener and the rule are inside the balancer itself; the target group is only a list the balancer reads — none of the three is a separate machine the request passes through", "The request travels through the listener, then the rule, then the target group as three separate hops before reaching the app server", "The rule is a machine that inspects the request before handing it to the listener", "The target group is a machine dedicated to routing decisions, separate from the balancer"], correct: 0, explain: "Slide 10: the part drawn wrong most often. The listener and rule are inside the balancer, and the target group is a list it reads — the request goes from the balancer straight to the one machine chosen." },
  { lesson: "Lesson 38", q: "Of the five common reasons a target group's health check reports a machine unhealthy — a redirect on the health path, the app listening only on localhost, a blocking security group, a grace period shorter than boot time, and a port mismatch — which does the deck call the most common, and least interesting to debug?", answers: ["A port mismatch — the health check asks on one port while the application listens on another, so keeping listener, security group, health check, and application on the same port avoids it", "The grace period being shorter than the boot time, since new machines almost always boot slower than expected", "The health path returning a redirect, since an HTTP redirect is the hardest failure to reproduce", "The security group blocking the balancer, since that misconfiguration is the rarest to fix"], correct: 0, explain: "Slide 16: all five are configuration, not bad luck, and each has one check that settles it — but a port that doesn't match end-to-end (listener, security group, health check, application) is the most common of the five and the least interesting to chase down." },

  // ── Lesson 39: The Group That Keeps The Count ──
  { lesson: "Lesson 39", q: "All targets in a target group are unhealthy at the same moment. What does the load balancer actually do?", answers: ["It sends requests to the unhealthy targets anyway — refusing every request is worse than trying one that might still answer, so it fails open and you see whatever the dead application produces (a 502 or a 504)", "It returns a 503 for every request, because a target group with no healthy machines behaves the same as one with no registered targets", "It queues requests until a target becomes healthy again, then delivers them in order", "It automatically triggers the Auto Scaling group to launch replacement machines before serving any more traffic"], correct: 0, explain: "Slide 2: AWS calls this failing open. A real 503 means something different — no registered targets at all, not unhealthy ones." },
  { lesson: "Lesson 39", q: "Two identical machines built from the same launch template show different health status right after they're created. Where do the settings that explain this actually live?", answers: ["interval and unhealthy_threshold sit on the target group; the grace period that keeps a new machine from being judged too early sits on the Auto Scaling group", "All three settings — interval, unhealthy_threshold, and the grace period — sit on the target group", "All three settings sit on the Auto Scaling group, since it owns the machines", "interval and the grace period sit on the target group; unhealthy_threshold sits on the launch template"], correct: 0, explain: "Slide 3: a split result is the check arriving before the application finished installing, not two machines in different condition — AWS calls this state initial, with reason code Elb.InitialHealthChecking." },
  { lesson: "Lesson 39", q: "A repo still has an aws_instance resource with for_each, plus target_group_attachment resources, in the same folder as a newly added aws_autoscaling_group. What happens if both are left in place and applied?", answers: ["Two machines the group doesn't manage keep running and billed beside the ones the group builds — the instance block and its attachments have to be deleted for the group to be the only thing creating machines", "Terraform refuses to apply, since a target group can't have both a fixed instance and an Auto Scaling group registering into it", "The Auto Scaling group automatically adopts the aws_instance machines as if it had built them itself", "The aws_instance machines are silently terminated the next time the Auto Scaling group scales"], correct: 0, explain: "Slide 13: machines exist because the group keeps that number, not because the file lists them individually — delete the instance block and the attachments, then apply." },

  // ── Lesson 40: Closing the Unit ──
  { lesson: "Lesson 40", q: "An Auto Scaling group's health check type is switched from EC2 to ELB. The application on a machine has hung, but the process is still alive. What changes?", answers: ["The group now also uses the target group's answer, so the hung machine can be caught and replaced — the EC2 status check alone would have passed it forever since the process never actually died", "Nothing — health check type only changes which console page shows the status, not what the group acts on", "The EC2 status check stops running entirely once ELB is selected", "The group starts checking RAM and CPU directly instead of asking the target group anything"], correct: 0, explain: "Slide 2: ELB adds the target group's answer on top of the status check, it isn't a swap. A hung-but-alive process passes the EC2 status check forever, which is exactly the gap ELB closes." },
  { lesson: "Lesson 40", q: "A target tracking policy is set with ASGAverageCPUUtilization and a target value. Average CPU then drops well below that target. What does the policy do?", answers: ["It scales in, removing machines — the same policy scales both out above the target and in below it, bounded by the group's minimum and maximum", "Nothing, since target tracking policies only ever add machines, never remove them", "It waits for a separate scale-in policy to be created, since one policy can only act in one direction", "It lowers the target value automatically to match the new average"], correct: 0, explain: "Slide 3: one policy holds one number and moves the count in both directions around it. Minimum and maximum still cap it — a policy can't push the group past either edge." },
  { lesson: "Lesson 40", q: "An ACM certificate is attached to a load balancer's port-443 listener, and a redirect action is set on the port-80 listener. Where does TLS actually end?", answers: ["At the balancer — it decrypts the HTTPS request there and forwards to the application machines over plain HTTP, which is TLS termination", "At the application machine, since the certificate has to be installed wherever the request is finally answered", "Nowhere — traffic stays encrypted from the browser all the way to the application", "At the redirect on port 80, since that's the listener doing the http-to-https rewrite"], correct: 0, explain: "Slide 4: the redirect on port 80 only sends a plain request back as HTTPS; the balancer holds the certificate and decrypts on port 443, then talks to the machines over plain HTTP behind it — that decrypt point is TLS termination." },

  { lesson: "Lesson 41", q: "RAM used, disk space used, and an application's own log events never show up in CloudWatch with nothing installed, while request counts and CPU do. What explains the difference?", answers: ["AWS counts requests and CPU from outside the operating system; RAM, disk, and log files are known only inside the operating system, which needs a program running there to report them", "RAM and disk metrics cost extra, so AWS omits them from the free tier by default", "CPU and requests are the only two metrics CloudWatch supports without the agent installed, by hardcoded limit", "The balancer publishes every metric it can see, and it simply cannot see request counts"], correct: 0, explain: "Slide 11: anything measured inside the machine needs a program running inside the machine — that's the rule the CloudWatch agent exists to satisfy." },
  { lesson: "Lesson 41", q: "A log group named \"investment-app\" is never given a retention_in_days setting. What does that silence actually mean?", answers: ["Keep the log events forever — leaving retention unset is a decision, not a neutral default, and volume-driven storage costs accrue every month", "CloudWatch refuses to accept any log events until retention is explicitly set", "A 14-day retention is applied automatically as the platform default", "Retention only matters for metrics, not for log groups, so nothing is affected"], correct: 0, explain: "Slide 16: the default is keep forever. Storage is charged per gigabyte sent in and per gigabyte per month kept, so leaving retention unset means volume drives a growing bill with nobody having chosen that." },

  { lesson: "Lesson 43", q: "A new version deployed through instance refresh turns out to have changed the database, and it's now misbehaving. A teammate wants to roll back the code to the previous template version. What does the deck say about that move?", answers: ["Rolling back the code often does not undo the deploy — if the bad version already changed the database, that change is still applied, and the old code now faces data it doesn't expect; shipping a corrected version forward is frequently the safer move", "Rolling back the code always reverts any database change the bad version made, since the old template version never saw that data", "Rollback is impossible once a refresh has started, so the only option is to wait for it to finish", "Rolling back is always safe and always the right first move, regardless of what the bad version changed"], correct: 0, explain: "Slide 12: rollback is a decision, not a button. A database change made by the bad version is already applied — putting the old code back just leaves it facing data it doesn't expect." },

let questions = [];
let current = 0;
let score = 0;
let missed = [];
let answered = false;

const BAG_KEY = 'dtc312_quiz_bag';

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Draws `count` questions with no repeats until the entire question bank
// has been served once. Progress persists in localStorage, so running
// "Quick — 20 random" back to back surfaces fresh questions each time
// instead of re-picking ones you just saw.
function drawFromBag(count) {
  let bag = [];
  try {
    const saved = JSON.parse(localStorage.getItem(BAG_KEY));
    if (Array.isArray(saved) && saved.every(i => Number.isInteger(i) && i >= 0 && i < ALL_QUESTIONS.length)) {
      bag = saved;
    }
  } catch (e) { /* ignore corrupt/missing data */ }

  const drawn = [];
  while (drawn.length < count && drawn.length < ALL_QUESTIONS.length) {
    if (bag.length === 0) {
      bag = shuffle([...Array(ALL_QUESTIONS.length).keys()]);
    }
    drawn.push(bag.shift());
  }

  localStorage.setItem(BAG_KEY, JSON.stringify(bag));
  return drawn.map(i => ALL_QUESTIONS[i]);
}

function startQuiz(mode) {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizSection').classList.add('show');

  if (mode === 'random20') {
    questions = drawFromBag(20);
  } else {
    questions = shuffle(ALL_QUESTIONS);
  }

  current = 0;
  score = 0;
  missed = [];
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  const total = questions.length;

  document.getElementById('progressLabel').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('scoreLabel').textContent = `Score: ${score}`;
  document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;
  document.getElementById('lessonBadge').textContent = q.lesson;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('explanation').textContent = '';
  document.getElementById('nextBtn').classList.remove('show');

  // Shuffle answer order
  const letters = ['A', 'B', 'C', 'D'];
  const indices = shuffle([0, 1, 2, 3]);
  const container = document.getElementById('answersContainer');
  container.innerHTML = '';

  indices.forEach((origIdx, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${q.answers[origIdx]}</span>`;
    btn.dataset.original = origIdx;
    btn.onclick = () => selectAnswer(btn, origIdx === q.correct, q);
    container.appendChild(btn);
  });
}

function selectAnswer(btn, isCorrect, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.answer-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (parseInt(b.dataset.original) === q.correct) {
      b.classList.add(b === btn ? 'correct' : 'reveal');
    }
  });

  if (isCorrect) {
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    missed.push({ q: q.q, a: q.answers[q.correct] });
  }

  document.getElementById('scoreLabel').textContent = `Score: ${score}`;

  const exp = document.getElementById('explanation');
  exp.textContent = q.explain;
  exp.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
  document.getElementById('nextBtn').textContent = current + 1 < questions.length ? 'Next question →' : 'See my score →';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) {
    showScore();
  } else {
    renderQuestion();
  }
}

function showScore() {
  document.getElementById('quizSection').classList.remove('show');
  const screen = document.getElementById('scoreScreen');
  screen.classList.add('show');

  const total = questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalDenom').textContent = `/ ${total}`;
  document.getElementById('progressFill').style.width = '100%';

  let title, msg;
  if (pct === 100) { title = '🏆 Perfect score!'; msg = 'You know this material cold.'; }
  else if (pct >= 80) { title = '🎉 Great work!'; msg = `${pct}% — you're in solid shape. Review the ones you missed.`; }
  else if (pct >= 60) { title = '📚 Getting there!'; msg = `${pct}% — keep reviewing and you'll nail it.`; }
  else { title = '🔁 Keep studying!'; msg = `${pct}% — go back to the notes and try again.`; }

  document.getElementById('scoreTitle').textContent = title;
  document.getElementById('scoreMsg').textContent = msg;

  if (missed.length > 0) {
    const list = document.getElementById('missedList');
    list.style.display = 'block';
    const items = document.getElementById('missedItems');
    items.innerHTML = '';
    missed.forEach(m => {
      const d = document.createElement('div');
      d.className = 'missed-item';
      d.innerHTML = `<div class="q">${m.q}</div><div class="a">✓ ${m.a}</div>`;
      items.appendChild(d);
    });
  }
}

function restartQuiz() {
  document.getElementById('scoreScreen').classList.remove('show');
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('missedList').style.display = 'none';
  document.getElementById('missedItems').innerHTML = '';
}

function reviewMissed() {
  if (missed.length === 0) return;
  // Build questions from missed items
  const missedQs = missed.map(m => ALL_QUESTIONS.find(q => q.q === m.q)).filter(Boolean);
  if (missedQs.length === 0) return;
  document.getElementById('scoreScreen').classList.remove('show');
  document.getElementById('quizSection').classList.add('show');
  document.getElementById('missedList').style.display = 'none';
  document.getElementById('missedItems').innerHTML = '';
  questions = shuffle(missedQs);
  current = 0;
  score = 0;
  missed = [];
  renderQuestion();
}
</script>
